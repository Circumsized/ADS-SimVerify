# root_dora_dataflow.yaml 是仓库级"概念集成拓扑",并非生产部署拓扑。
#
# 本文件存在的目的:
#   1. 一张图说明完整自驾链路(感知 → BEV → NMPC → 安全监督 → 控制);
#   2. 与 contracts/v1/data_contracts.json 的流名一一对应,作为 Phase 1 数据契约的"图示层";
#   3. 给读者一个起点,然后指向已通过 Phase 5-I / Phase 5-J / Phase 5-K 白盒验收的
#      Dora 仿真拓扑;
#
# 它不是被 `dora start` 启动的真正生产拓扑。任何包含 `isaac_sim_env` 节点的拓扑
# 都是仿真集成。真正被认可为"仿真 release candidate"主链的是:
#
#   - contracts/phase5/dora_dataflow_phase5i_control.yaml   (Dora 控制 + 安全监督)
#   - contracts/phase5/dora_dataflow_phase5k_resilience.yaml (72,000 帧耐久 + 故障注入)
#
# 真机准入六项门禁全部阻塞,任何想直接拿这份拓扑上真车的尝试都被显式禁止
# (详见 HANDOFF.md 第 8 节、README.md 第 9 节「实机部署建议」)。
#
# 与 contracts/v1/data_contracts.json 的对齐见 contracts/v1/runtime_contract.json,
# 可执行校验: uv run contracts/v1/validate_contracts.py
nodes:
  - id: isaac_sim_env
    path: ${ISAAC_SIM_PYTHON_SH}
    args: simulation-env/isaac_dora_node.py
    env:
      DISPLAY: ${DISPLAY}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY}
      XDG_SESSION_TYPE: ${XDG_SESSION_TYPE}
      LD_LIBRARY_PATH: ${ISAAC_SIM_LD_LIBRARY_PATH}
    inputs:
      control_cmd: fast_brain_nmpc/control_cmd
    outputs:
      - xfeat_features
      - odometry
      - jpeg_image
      - bev_grid
  - id: core_perception
    path: target/release/perception_node
    build: cargo build -p core-perception --release --bin perception_node
    env:
      ORT_DYLIB_PATH: ${ORT_DYLIB_PATH}
      PIDNET_MODEL_PATH: model/pidnet_s.onnx
      XFEAT_MODEL_PATH: model/xfeat_640x640.onnx
      XFEAT_FRAME_INTERVAL: "10"
      CAMERA_IMAGE_WIDTH: "640"
      CAMERA_IMAGE_HEIGHT: "480"
      CAMERA_FX: "204.25533"
      CAMERA_FY: "153.19150"
      CAMERA_CX: "319.5"
      CAMERA_CY: "239.5"
      CAMERA_FORWARD_OFFSET_M: "0.06935859"
      CAMERA_LEFT_OFFSET_M: "-0.00000002"
      CAMERA_HEIGHT_M: "0.13328385"
      CAMERA_YAW_RAD: "0.076109"
      CAMERA_PITCH_RAD: "0.168662"
      CAMERA_ROLL_RAD: "0.0"
      BEV_METERS_PER_CELL: "0.1041666667"
      BEV_MIN_FORWARD_M: "0.20"
      BEV_EGO_ROW: "95.5"
      BEV_EGO_COL: "95.5"
    inputs:
      jpeg_image:
        source: isaac_sim_env/jpeg_image
        queue_size: 1
    outputs:
      - bev_grid
      - bev_semantic
      - xfeat_features
  - id: optical_reflex_node
    path: uv
    args: run --cache-dir ${UV_CACHE_DIR} simulation-env/optical_reflex_node.py
    inputs:
      jpeg_image: isaac_sim_env/jpeg_image
      odometry: isaac_sim_env/odometry
      bev_grid: core_perception/bev_grid
    outputs:
      - ttc
  - id: fast_brain_nmpc
    path: target/release/fast_brain_node
    build: cargo build -p core-control --release --bin fast_brain_node
    env:
      RUST_LOG: info
      DORA_RUNTIME_TYPE_CHECK: warn
      LD_LIBRARY_PATH: ${ACADOS_LIBRARY_PATH}:${ACADOS_GENERATED_LIBRARY_PATH}
    inputs:
      odometry: isaac_sim_env/odometry
      human_prior: slow_brain_mapper/human_prior
      ttc: optical_reflex_node/ttc
      bev_grid: core_perception/bev_grid
    outputs:
      - control_cmd
  - id: slow_brain_mapper
    path: target/release/slow_brain_node
    build: cargo build -p core-decision --release --bin slow_brain_node
    env:
      RUST_LOG: info
    inputs:
      xfeat_features: core_perception/xfeat_features
      odometry: isaac_sim_env/odometry
    outputs:
      - human_prior
  # telemetry_dashboard 是只读可视化节点。其 6 条输入边由冻结的
  # contracts/v1/data_contracts.json 声明,故保留本节点以维持拓扑与契约一致;
  # 实现文件 showcase/src/bin/telemetry_dashboard.py 当前缺失,记为已知偏差
  # P1-D007,不作为可运行主链,也不改变任何数据流语义。
  - id: telemetry_dashboard
    path: uv
    args: run --cache-dir ${UV_CACHE_DIR} showcase/src/bin/telemetry_dashboard.py
    env:
      DISPLAY: ${DISPLAY}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY}
    inputs:
      odometry: isaac_sim_env/odometry
      xfeat_features: core_perception/xfeat_features
      human_prior: slow_brain_mapper/human_prior
      control_cmd: fast_brain_nmpc/control_cmd
      jpeg_image: isaac_sim_env/jpeg_image
      bev_grid: core_perception/bev_grid