# ADS-SimVerify Phase 3.3: Human "Spice" data collection topology.
# NMPC control authority is disabled; the human teleop directly drives the chassis.
# Compass goal generator and manual reposition loop are coordinated by isaac_dora_node.
nodes:
  - id: isaac_sim_env
    path: ${ISAAC_SIM_PYTHON_SH}
    args: simulation-env/isaac_dora_node.py
    env:
      DISPLAY: ${DISPLAY}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY}
      XDG_SESSION_TYPE: ${XDG_SESSION_TYPE}
      LD_LIBRARY_PATH: ${ISAAC_LD_LIBRARY_PATH}
      UV_CACHE_DIR: ${UV_CACHE_DIR}
    inputs:
      control_cmd: keyboard_teleop/control_cmd
    outputs:
      - human_prior
      - xfeat_features
      - odometry
      - jpeg_image
      - bev_grid

  - id: keyboard_teleop
    path: uv
    args: run simulation-env/keyboard_teleop.py
    env:
      UV_CACHE_DIR: ${UV_CACHE_DIR}
    inputs:
      tick: dora/timer/millis/100
    outputs:
      - control_cmd

  - id: expert_data_logger
    path: uv
    args: run simulation-env/expert_logger_node.py
    env:
      UV_CACHE_DIR: ${UV_CACHE_DIR}
    inputs:
      odometry: isaac_sim_env/odometry
      human_prior: isaac_sim_env/human_prior
      bev_grid: isaac_sim_env/bev_grid
      control_cmd: keyboard_teleop/control_cmd

  - id: goal_hud
    path: uv
    args: run simulation-env/goal_hud_node.py
    env:
      DISPLAY: ${DISPLAY}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY}
      XDG_SESSION_TYPE: ${XDG_SESSION_TYPE}
      UV_CACHE_DIR: ${UV_CACHE_DIR}
    inputs:
      odometry: isaac_sim_env/odometry
      human_prior: isaac_sim_env/human_prior
