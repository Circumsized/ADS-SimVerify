name: CI
on:
  push:
    branches: [main, "refactor/**"]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
  python-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Actuator control-gate unit tests (no Isaac/Dora deps)
        run: python -m unittest discover -s simulation-env -p "test_*.py" -v
      - name: Repository hygiene (machine-readable)
        run: |
          python scripts/check_repo_hygiene.py --report artifacts/ci/hygiene_report.json --json
      - run: python scripts/check_code_style.py
  contracts-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - name: Phase 1 data contracts
        run: python contracts/v1/validate_contracts.py
      - name: Real-vehicle pre-hardware gate
        run: python -m unittest discover -s contracts/real_vehicle -p "test_*.py" -v
  rust-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libopencv-dev
      - name: Download onnxruntime (runtime, load-dynamic)
        run: |
          V=1.27.0
          curl -sL https://github.com/microsoft/onnxruntime/releases/download/v$V/onnxruntime-linux-x64-$V.tgz | tar xz
          echo "ORT_DYLIB_PATH=$(find . -name 'libonnxruntime.so*' | head -1)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo clippy -p core-perception -p core-decision --all-targets --locked -- -D warnings
      - run: cargo test -p core-perception -p core-decision --locked
      # core-control links the acados C solver at build time; acados is not
      # installed in CI, so only type/lint-level `check` runs here. The
      # wheel-capable build and its runtime tests are an environment-gated
      # gate on the Linux + acados host (see docs/conventions.md), and the
      # real-vehicle six-gate admission stays blocked regardless.
      - run: cargo check -p core-control --all-targets --locked
  upload-hygiene-report:
    runs-on: ubuntu-latest
    needs: python-hygiene
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: fsd-simverify-hygiene
          path: artifacts/ci/hygiene_report.json
          if-no-files-found: warn